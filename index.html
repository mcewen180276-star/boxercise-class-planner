</style></head><body><header><div><h1>🥊 Boxercise Class Planner</h1><small>Plan • Rotate • Coach • Print</small></div><div class="row"><button onclick="exportData()">Export backup</button><label class="btn" style="margin:0">Import backup<input hidden type="file" accept="application/json" onchange="importData(event)"></label></div></header><nav id="nav"></nav><main id="app"></main><footer>Non-contact fitness training • Local-first, no account required • Technique demonstrations should be reviewed before class</footer><script>
const EQUIPMENT=['Focus pads','Boxing gloves','Punch bags','Skipping ropes','Exercise mats','Dumbbells','Kettlebells','Resistance bands','Medicine balls','Battle ropes','Cones','Agility ladders','Step platforms','Benches','Exercise balls','Bodyweight only'];
const FOCUSES=['Mixed boxercise','Cardio endurance','Boxing technique','Strength and conditioning','Footwork and agility','Core and coordination','Low-impact boxercise'];
const FORMATS=['Everyone together','Circuit stations','Mixed class'];
const GROUPS=['Pairs','Threes','Mixed pairs and threes'];
const CATEGORIES=['Padwork','Shadowboxing','Footwork','Agility','Cardio','Core','Strength','Mobility','Coordination','Recovery'];
const base=[];let uid=1;
function add(name,category,equipment,level='All',low=false,desc='',focus='Mixed boxercise',format='Both'){base.push({id:'ex'+uid++,name,category,equipment,level,low,desc:desc||'Coach-led non-contact fitness drill; adjust pace and range to ability.',focus,format,custom:false})}
const exercises={
'Padwork':['Timed single-punch pad rhythm','Alternating pad callouts','Light-contact pad accuracy','Pad target changes','Pad rhythm intervals','Pad-and-reset rounds','Mirror pad coordination','Reaction pad callouts','Padwork with active recovery','Tempo-change pad rounds','Partner switch pad rounds','Precision target rounds'],
'Shadowboxing':['Gentle shadowboxing flow','Timed shadowboxing rounds','Rhythm shadowboxing','Shadowboxing with pauses','Shadowboxing and mobility','Low-impact shadowboxing','Mirror shadowboxing','Shadowboxing with footwork','Shadowboxing reaction cues','Shadowboxing intervals','Seated shadowboxing fitness','Shadowboxing coordination ladder'],
'Footwork':['Forward-backward stepping','Lateral step patterns','Cone navigation','Pivot and reset footwork','Box-step pattern','Step-and-freeze balance','Mirror partner steps','Directional callout steps','Low-impact side steps','Agility square steps','Corner-to-corner movement','Footwork tempo ladder'],
'Agility':['Agility ladder walk-through','Cone shuttle walk','Reaction colour callouts','Partner mirror movements','Side-to-side line steps','Fast feet on the spot','Quick direction changes','Balance reach drill','Cone figure-eight walk','Agility ladder lateral steps','Step pattern memory game','Partner direction signals'],
'Cardio':['Marching intervals','Jogging on the spot','Low-impact jacks','Step jacks','Skipping rope intervals','Imaginary rope skipping','Boxer step cardio','High-knee marching','Step platform intervals','Shadowboxing cardio bursts','Fast-feet intervals','Partner relay steps'],
'Core':['Standing knee lifts','Standing trunk stability','Dead bug','Bird dog','Forearm plank','Side plank from knees','Standing anti-rotation band press','Seated knee raises','Glute bridge','Standing cross-body reaches','Bear hold','Slow mountain climber'],
'Strength':['Bodyweight squats','Sit-to-stand','Reverse lunges','Wall push-ups','Incline push-ups','Resistance band rows','Dumbbell rows','Kettlebell deadlift','Medicine ball hold and march','Calf raises','Step-ups','Resistance band pull-aparts'],
'Mobility':['Shoulder circles','Thoracic rotations','Gentle hip circles','Ankle mobility','Standing hamstring mobility','Neck mobility','Arm swings','Hip flexor mobility','Wrist circles','Standing side reaches','Cat-cow','Supported calf stretch'],
'Coordination':['Partner mirror steps','Clap reaction game','Number callout footwork','Cross-body coordination','Step and reach pattern','Rhythm change drill','Opposite arm-leg march','Balance and tap','Partner colour reaction','Alternating hand target touch','Memory movement sequence','Two-person timing challenge'],
'Recovery':['Slow march and breathing','Standing calf stretch','Gentle shoulder stretch','Chest-opening mobility','Seated breathing','Gentle upper-back mobility','Slow side stepping','Standing quadriceps stretch','Gentle trunk rotation','Ankle circles','Wrist and forearm mobility','Relaxed cooldown walk']};
Object.entries(exercises).forEach(([cat,names])=>names.forEach((name,i)=>{let eq='Bodyweight only';if(/pad/i.test(name))eq='Focus pads';else if(/rope skipping|skipping rope/i.test(name))eq='Skipping ropes';else if(/ladder/i.test(name))eq='Agility ladders';else if(/cone/i.test(name))eq='Cones';else if(/band/i.test(name))eq='Resistance bands';else if(/dumbbell/i.test(name))eq='Dumbbells';else if(/kettlebell/i.test(name))eq='Kettlebells';else if(/medicine ball/i.test(name))eq='Medicine balls';else if(/step platform|step-ups/i.test(name))eq='Step platforms';else if(/plank|dead bug|bird dog|glute bridge|cat-cow|bear hold/i.test(name))eq='Exercise mats';add(name,cat,eq,i%7===0?'Beginner':'All',/low-impact|gentle|seated|march|walk|mobility|stretch|breathing|sit-to-stand|wall push/i.test(name),'Non-contact fitness exercise. Coach posture, control and a comfortable range of motion.',cat==='Footwork'||cat==='Agility'?'Footwork and agility':cat==='Strength'?'Strength and conditioning':cat==='Core'||cat==='Coordination'?'Core and coordination':cat==='Cardio'?'Cardio endurance':cat==='Padwork'||cat==='Shadowboxing'?'Boxing technique':'Mixed boxercise')}));
// Combination descriptions are fitness-oriented, not sparring instructions.
const moves=['Jab','Cross','Hook','Uppercut'];const movement=['Side step','Reset','Pivot','Step back','Direction change'];const defense=['Slip movement','Duck movement','Weave movement'];
const combinations=[];let cid=1;
for(let difficulty=1;difficulty<=3;difficulty++){for(let i=0;i<45;i++){let n=difficulty+1+(i%2);let seq=Array.from({length:n},(_,j)=>moves[(i+j*3+difficulty)%4]);if(i%3===0)seq.push(movement[(i+difficulty)%movement.length]);if(i%4===0)seq.push(defense[(i+difficulty)%defense.length]);combinations.push({id:'combo'+cid++,name:`${difficulty===1?'Foundation':difficulty===2?'Flow':'Challenge'} sequence ${String(i+1).padStart(2,'0')}`,sequence:seq.join(' • '),level:['Beginner','Intermediate','Advanced'][difficulty-1],kind:i%4===0?'Movement + defensive fitness':i%3===0?'Punch + footwork':'Punch rhythm',notes:'Non-contact shadowboxing or light padwork; use controlled movements, clear space and a coach-approved demonstration.'})}}
// Carefully scoped exercise descriptions: technique notes are the primary reference, not unverified video results.
const categoryInstructions={
Padwork:'In pairs, one person holds focus pads steady at a comfortable height while the other makes light, controlled contacts. Keep wrists aligned, shoulders relaxed and switch roles at the cue.',
Shadowboxing:'Stand with feet comfortably apart and knees soft. Rehearse the named movements into clear space without contact, returning hands to a relaxed ready position between actions.',
Footwork:'Move with small balanced steps, keeping feet apart rather than crossing them. Pause, regain balance and repeat the pattern in the opposite direction.',
Agility:'Set out a clear, non-slip working area. Perform the named stepping or reaction pattern at a pace that allows controlled stops and changes of direction.',
Cardio:'Work at a sustainable pace, breathing naturally and landing softly. Reduce speed or use marching instead of bouncing if needed.',
Core:'Brace gently and breathe throughout the movement. Keep the trunk stable, avoid forcing range and shorten the lever or duration if control is lost.',
Strength:'Move slowly through a comfortable range with steady breathing. Keep joints aligned and use lighter resistance or support when needed.',
Mobility:'Move gently through a pain-free range without bouncing or forcing the joint. Keep breathing and reduce the range if uncomfortable.',
Coordination:'Start slowly, learn the sequence, then gradually add rhythm. Prioritise accuracy and balance over speed.',
Recovery:'Ease the pace, breathe steadily and move through a gentle comfortable range. Do not force stretches.'};
const specificInstructions=[
[/dead bug/i,'Lie on your back, raise bent knees and arms, then slowly extend opposite arm and leg without arching the lower back; return and alternate.'],
[/bird dog/i,'On hands and knees, reach one arm and the opposite leg away, keep hips level, pause and change sides.'],
[/forearm plank|bear hold/i,'Support your body on forearms and toes for a plank, or hands and knees hovering slightly for a bear hold; maintain steady breathing.'],
[/side plank/i,'Lie on your side with knees bent, support on the forearm and lift hips slightly while keeping shoulder comfortable.'],
[/squat|sit-to-stand/i,'Send hips back as if sitting on a chair, bend knees within a comfortable range and stand tall again.'],
[/lunge/i,'Step one foot behind, lower a small comfortable distance with the front knee tracking over the foot, then return.'],
[/push-up/i,'Place hands on a stable wall or raised surface, bend elbows to bring chest closer, then press away without sagging.'],
[/row/i,'Pull handles or weight toward the ribs with elbows close, pause briefly and lower under control without shrugging.'],
[/deadlift/i,'Hold weight close, soften knees and hinge at the hips with a long back; stand by driving through the feet.'],
[/skipping/i,'Turn the rope with small wrist circles and step or hop lightly; use imaginary rope steps if needed.'],
[/jab|cross|hook|uppercut/i,'Rehearse controlled straight or curved arm movements without locking elbows. On pads, use light contact only and reset between repetitions.'],
[/pivot/i,'Turn gently on the balls of the feet to face a new direction while keeping knees aligned and balance steady.'],
[/cone/i,'Space cones widely enough for clear movement; follow the named path with short controlled steps and no sharp collisions.'],
[/ladder/i,'Step into and out of the marked ladder spaces with controlled foot placement; start walking before increasing tempo.'],
[/stretch/i,'Ease into a gentle stretch, hold comfortably without bouncing and release slowly.']];
function coaching(e){if(e.desc&&e.custom)return e.desc;let special=specificInstructions.find(([rx])=>rx.test(e.name));return (special?special[1]:categoryInstructions[e.category]||'Move at a comfortable pace with controlled technique.')+' '+(categoryInstructions[e.category]||'')+' Adapt range, pace or support to suit the participant.'}
function demonstration(e){let url=e.video||'';if(/^https:\/\/(www\.)?(youtube\.com|youtu\.be|acefitness\.org|exrx\.net|nhs\.uk)\//i.test(url))return url;return null}
// Additional exercises, organised by movement pattern and equipment, not misleading automatic video matches.
const expanded={
'Padwork':[['Single jab accuracy','Focus pads'],['Cross accuracy and reset','Focus pads'],['Alternating jab and cross rhythm','Focus pads'],['Hook target control','Focus pads'],['Uppercut target control','Focus pads'],['One-two pad rhythm','Focus pads'],['Three-punch pad rhythm','Focus pads'],['Four-punch pad rhythm','Focus pads'],['Pad target height changes','Focus pads'],['Pad holder verbal cues','Focus pads'],['Light pad contact and step back','Focus pads'],['Padwork and side step','Focus pads'],['Padwork and pivot reset','Focus pads'],['Padwork with 20-second role swap','Focus pads'],['Padwork with 30-second role swap','Focus pads'],['Padwork and marching recovery','Focus pads']],
'Shadowboxing':[['Jab-only shadowboxing','Bodyweight only'],['Cross-only shadowboxing','Bodyweight only'],['Straight-punch rhythm','Bodyweight only'],['Hook motion shadowboxing','Bodyweight only'],['Uppercut motion shadowboxing','Bodyweight only'],['Shadowboxing with step back','Bodyweight only'],['Shadowboxing with lateral travel','Bodyweight only'],['Shadowboxing with gentle duck','Bodyweight only'],['Shadowboxing with gentle weave','Bodyweight only'],['Shadowboxing and pivot','Bodyweight only'],['Shadowboxing with 10-second pauses','Bodyweight only'],['Shadowboxing with alternating tempo','Bodyweight only'],['Partner mirror shadowboxing','Bodyweight only'],['Shadowboxing number callouts','Bodyweight only'],['Shadowboxing balance reset','Bodyweight only']],
'Footwork':[['Forward step and reset','Bodyweight only'],['Backward step and reset','Bodyweight only'],['Two steps left two steps right','Bodyweight only'],['Four-corner footwork','Cones'],['Wide square walk','Cones'],['Pivot left and reset','Bodyweight only'],['Pivot right and reset','Bodyweight only'],['Diagonal step pattern','Bodyweight only'],['Step in and step out','Bodyweight only'],['Side step and freeze','Bodyweight only'],['Partner follow-the-leader steps','Bodyweight only'],['Directional callout shuffle','Bodyweight only']],
'Agility':[['Ladder single steps','Agility ladders'],['Ladder double steps','Agility ladders'],['Ladder in-and-out steps','Agility ladders'],['Ladder lateral walk','Agility ladders'],['Cone square walking','Cones'],['Cone zigzag walking','Cones'],['Cone colour reaction walk','Cones'],['Partner point-and-step','Bodyweight only'],['Quick feet then hold balance','Bodyweight only'],['Side steps over floor line','Bodyweight only'],['Three-cone direction calls','Cones'],['Partner mirrored side steps','Bodyweight only']],
'Cardio':[['Boxer bounce low impact','Bodyweight only'],['March and punch rhythm','Bodyweight only'],['Step jack and jab','Bodyweight only'],['Alternating toe taps','Step platforms'],['Low step-up intervals','Step platforms'],['Skipping alternating foot steps','Skipping ropes'],['Skipping two-foot rhythm','Skipping ropes'],['Shadowboxing steady cardio','Bodyweight only'],['Fast march intervals','Bodyweight only'],['Side step cardio intervals','Bodyweight only'],['March and reach intervals','Bodyweight only'],['Punch bag light rhythm','Punch bags']],
'Core':[['Standing knee-to-elbow','Bodyweight only'],['Pallof press hold','Resistance bands'],['Pallof press repetitions','Resistance bands'],['Standing suitcase carry','Dumbbells'],['Glute bridge hold','Exercise mats'],['Dead bug heel taps','Exercise mats'],['Bird dog pauses','Exercise mats'],['Standing balance knee raises','Bodyweight only'],['Seated knee extensions','Benches'],['Side plank supported hold','Exercise mats'],['Standing slow cross-body taps','Bodyweight only'],['Plank shoulder taps from knees','Exercise mats']],
'Strength':[['Dumbbell goblet squat','Dumbbells'],['Dumbbell suitcase carry','Dumbbells'],['Dumbbell farmer carry','Dumbbells'],['Dumbbell floor press','Dumbbells'],['Resistance band pull-apart','Resistance bands'],['Resistance band chest press','Resistance bands'],['Resistance band biceps curl','Resistance bands'],['Kettlebell goblet squat','Kettlebells'],['Kettlebell suitcase carry','Kettlebells'],['Medicine ball squat hold','Medicine balls'],['Medicine ball front hold march','Medicine balls'],['Incline bench push-up','Benches'],['Bench sit-to-stand','Benches'],['Supported split squat','Bodyweight only']],
'Mobility':[['Gentle shoulder blade circles','Bodyweight only'],['Standing chest opener','Bodyweight only'],['Standing torso turn','Bodyweight only'],['Wrist flexion mobility','Bodyweight only'],['Wrist extension mobility','Bodyweight only'],['Supported ankle rocks','Bodyweight only'],['Hip hinge rehearsal','Bodyweight only'],['Standing hip openers','Bodyweight only'],['Gentle side bends','Bodyweight only'],['Seated shoulder rolls','Benches']],
'Coordination':[['Callout one-two rhythm','Bodyweight only'],['Mirror and freeze','Bodyweight only'],['Clap and step pattern','Bodyweight only'],['Alternating target touch','Focus pads'],['Number and direction callouts','Bodyweight only'],['Colour cone and step','Cones'],['Left-right rhythm steps','Bodyweight only'],['Slow-motion shadowboxing mirror','Bodyweight only'],['Step-and-punch count ladder','Bodyweight only'],['Partner reaction step','Bodyweight only']],
'Recovery':[['Gentle standing chest stretch','Bodyweight only'],['Seated shoulder release','Benches'],['Slow walking cool-down','Bodyweight only'],['Slow box breathing','Bodyweight only'],['Supported calf release','Bodyweight only'],['Gentle side reach cool-down','Bodyweight only'],['Standing wrist release','Bodyweight only'],['Relaxed arm swings','Bodyweight only']]};
Object.entries(expanded).forEach(([cat,items])=>items.forEach(([name,eq])=>add(name,cat,eq,'All',/gentle|slow|seated|walking|march|low impact|supported|mobility|stretch/i.test(name),'',cat==='Padwork'||cat==='Shadowboxing'?'Boxing technique':'Mixed boxercise')));
const defaults={name:'My Boxercise Class',duration:45,group:'Mixed pairs and threes',format:'Mixed class',focus:'Mixed boxercise',level:'Mixed abilities',participants:12,stations:4,round:90,rest:30,equipment:['Focus pads','Boxing gloves','Exercise mats','Skipping ropes','Bodyweight only'],warmup:8,cooldown:5};
const storageKey='boxercise-planner-v1';let state;try{state=JSON.parse(localStorage.getItem(storageKey))||{settings:defaults,custom:[],customCombos:[],plans:[]}}catch{state={settings:defaults,custom:[],customCombos:[],plans:[]}};state.settings={...defaults,...state.settings};state.custom||=[];state.customCombos||=[];state.plans||=[];
let tab='Builder',search='',catFilter='All',equipFilter='All',comboFilter='All',currentPlan=null,selectedPlanId=null,timerSeconds=90,timerRunning=false,timerId=null,showCheat=false;
function save(){localStorage.setItem(storageKey,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function allEx(){return [...base,...state.custom]}function allCombos(){return [...combinations,...state.customCombos]}function opt(items,v){return items.map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(x)}</option>`).join('')}function fmtTime(s){let m=Math.floor(s/60);return `${m}:${String(s%60).padStart(2,'0')}`}function nav(){document.getElementById('nav').innerHTML=['Builder','Exercises','Combinations','Saved classes','Round timer','Help'].map(t=>`<button class="${tab===t?'active':''}" onclick="switchTab('${t}')">${t}</button>`).join('')}function switchTab(t){tab=t;render()}function render(){nav();document.getElementById('app').innerHTML=({Builder:builder,Exercises:exercisePage,Combinations:comboPage,'Saved classes':savedPage,'Round timer':timerPage,Help:helpPage}[tab])()}
function updateSetting(k,v){state.settings[k]=['duration','participants','stations','round','rest','warmup','cooldown'].includes(k)?Number(v):v;save()}function toggleEq(v,checked){let a=state.settings.equipment;state.settings.equipment=checked?[...new Set([...a,v])]:a.filter(x=>x!==v);save()}
function builder(){let s=state.settings;return `<div class="hero"><h2>Build a class that flows.</h2><p>Choose your format, group size and equipment. Generate a follow-along workout, a station circuit or both in one session.</p><div class="statbar"><div class="stat"><strong>${allEx().length}</strong>Exercises</div><div class="stat"><strong>${allCombos().length}</strong>Combinations</div><div class="stat"><strong>${state.plans.length}</strong>Saved classes</div></div></div><div class="panel"><h2>1. Class setup</h2><div class="grid"><div class="format-card"><strong>Everyone together</strong><small>All participants follow the same coached activity.</small></div><div class="format-card"><strong>Circuit stations</strong><small>Choose how many stations and rotate groups.</small></div><div class="format-card"><strong>Mixed class</strong><small>Start together, then move into a circuit.</small></div></div><h3>2. Choose your settings</h3><div class="grid"><div><label>Class name</label><input value="${esc(s.name)}" onchange="updateSetting('name',this.value)"></div><div><label>Duration (minutes)</label><input type="number" min="15" max="180" value="${s.duration}" onchange="updateSetting('duration',this.value)"></div><div><label>Participants</label><input type="number" min="2" max="100" value="${s.participants}" onchange="updateSetting('participants',this.value)"></div><div><label>Group setup</label><select onchange="updateSetting('group',this.value)">${opt(GROUPS,s.group)}</select></div><div><label>Class format</label><select onchange="updateSetting('format',this.value)">${opt(FORMATS,s.format)}</select></div><div><label>Focus</label><select onchange="updateSetting('focus',this.value)">${opt(FOCUSES,s.focus)}</select></div><div><label>Ability</label><select onchange="updateSetting('level',this.value)">${opt(['Beginners','Mixed abilities','Experienced'],s.level)}</select></div><div><label>Circuit stations</label><input type="number" min="2" max="20" value="${s.stations}" onchange="updateSetting('stations',this.value)"></div><div><label>Work round (seconds)</label><input type="number" min="20" max="600" step="5" value="${s.round}" onchange="updateSetting('round',this.value)"></div><div><label>Rest / rotation (seconds)</label><input type="number" min="5" max="180" step="5" value="${s.rest}" onchange="updateSetting('rest',this.value)"></div><div><label>Warm-up (minutes)</label><input type="number" min="3" max="30" value="${s.warmup}" onchange="updateSetting('warmup',this.value)"></div><div><label>Cool-down (minutes)</label><input type="number" min="3" max="30" value="${s.cooldown}" onchange="updateSetting('cooldown',this.value)"></div></div><fieldset><legend>3. Available equipment</legend><div class="equipment-list">${EQUIPMENT.map(e=>`<label style="font-weight:400"><input type="checkbox" ${s.equipment.includes(e)?'checked':''} onchange="toggleEq('${e}',this.checked)">${e}</label>`).join('')}</div></fieldset><p class="section-note">Station count applies to circuit and mixed classes. Each generated circuit uses exactly the selected number of different exercises when enough match your equipment.</p><div class="row no-print"><button class="primary" onclick="generate()">✨ Generate class</button><button onclick="newManual()">Create blank manual class</button></div></div>${currentPlan?planView(currentPlan):'<div class="panel muted">Choose your class settings, then generate a structured session or start with a blank class.</div>'}`}
function seededShuffle(arr){return [...arr].sort(()=>Math.random()-.5)}function available(pool){let s=state.settings;return pool.filter(e=>(e.equipment==='Bodyweight only'||s.equipment.includes(e.equipment))&&(s.level!=='Beginners'||e.level!=='Advanced')&&(s.focus!=='Low-impact boxercise'||e.low||['Mobility','Recovery'].includes(e.category)))}
function pick(pool,n,used=new Set()){let a=seededShuffle(available(pool).filter(e=>!used.has(e.id)));if(a.length<n)a.push(...seededShuffle(available(pool).filter(e=>used.has(e.id))));let chosen=a.slice(0,n);chosen.forEach(e=>used.add(e.id));return chosen}
function generate(){let s=state.settings;let duration=Math.max(15,Math.min(180,s.duration)),warm=Math.min(s.warmup,Math.floor(duration*.3)),cool=Math.min(s.cooldown,Math.floor(duration*.25));let main=duration-warm-cool;if(main<5){alert('Increase the duration or reduce warm-up/cool-down.');return}let mode=s.format;let warmEx=pick(allEx().filter(e=>['Mobility','Cardio','Footwork'].includes(e.category)&&e.equipment==='Bodyweight only'),3);let coolEx=pick(allEx().filter(e=>e.category==='Recovery'),3);let focusCats={'Mixed boxercise':['Padwork','Shadowboxing','Footwork','Cardio','Core','Strength','Agility','Coordination'],'Cardio endurance':['Cardio','Shadowboxing','Footwork','Agility'],'Boxing technique':['Padwork','Shadowboxing','Footwork','Coordination'],'Strength and conditioning':['Strength','Core','Cardio'],'Footwork and agility':['Footwork','Agility','Coordination','Cardio'],'Core and coordination':['Core','Coordination','Footwork'],'Low-impact boxercise':['Mobility','Footwork','Shadowboxing','Coordination','Core','Cardio']}[s.focus];let pool=allEx().filter(e=>focusCats.includes(e.category));let used=new Set();let n=mode==='Everyone together'?Math.max(4,Math.min(16,Math.round(main/3))):Math.max(2,Math.min(20,Math.round(s.stations)||4));let chosen=pick(pool,n,used);if(mode!=='Everyone together'&&chosen.length<n){alert('Not enough matching exercises for '+n+' different stations. Select more equipment, reduce station count, or change focus.');return}if(!chosen.length){alert('No exercises match the equipment and focus. Try selecting bodyweight only or more equipment.');return}let combos=seededShuffle(allCombos().filter(c=>s.level!=='Beginners'||c.level==='Beginner')).slice(0,Math.min(5,Math.max(2,Math.floor(main/10))));let blocks=[];if(mode==='Everyone together')blocks=[{title:'Follow-along main workout',minutes:main,kind:'Together',items:chosen}];else if(mode==='Circuit stations')blocks=[{title:'Station circuit',minutes:main,kind:'Circuit',items:chosen}];else{let a=Math.max(3,Math.round(main*.45));blocks=[{title:'Follow-along technique and cardio',minutes:a,kind:'Together',items:pick(pool,Math.max(3,Math.min(8,Math.round(a/3))),used)},{title:'Rotating station circuit',minutes:main-a,kind:'Circuit',items:chosen}]};currentPlan={id:'p'+Date.now(),name:s.name||'Boxercise class',created:new Date().toISOString(),settings:structuredClone(s),duration,warm,cool,warmEx,coolEx,blocks,combos,notes:'',manual:false};showCheat=false;render()}
function newManual(){let s=state.settings;currentPlan={id:'p'+Date.now(),name:s.name||'Manual class',created:new Date().toISOString(),settings:structuredClone(s),duration:s.duration,warm:s.warmup,cool:s.cooldown,warmEx:[],coolEx:[],blocks:[{title:'Main workout',minutes:Math.max(1,s.duration-s.warmup-s.cooldown),kind:s.format==='Circuit stations'?'Circuit':'Together',items:[]}],combos:[],notes:'',manual:true};showCheat=false;render()}
function roleText(group){return group==='Pairs'?'Pairs: A does the non-contact fitness drill while B holds pads or coaches, then swap after each interval.':group==='Threes'?'Threes: A performs, B holds pads or coaches, C completes a safe conditioning movement; rotate A → B → C each interval.':'Pairs: swap A/B each interval. Threes: rotate performer, pad holder/coach and conditioning role each interval.'}
function planView(p){let s=p.settings;return `<div class="panel" id="plan"><div class="row"><h2>${esc(p.name)}</h2><span class="chip">${p.duration} min</span><span class="chip">${esc(s.group)}</span><span class="chip">${esc(s.format)}</span></div><p class="muted">${esc(s.focus)} • ${esc(s.level)} • ${s.participants} participants</p><p class="warning">${roleText(s.group)} All activities are non-contact; no participant should be struck. For odd numbers in pairs, create one three-person group.</p><div class="row no-print"><button class="primary" onclick="savePlan()">Save class</button><button onclick="showCheat=!showCheat;render()">${showCheat?'Detailed view':'Instructor cheat sheet'}</button><button onclick="window.print()">Print / PDF</button><button onclick="downloadPlan()">Export class JSON</button></div>${showCheat?cheatView(p):fullView(p)}<label class="no-print">Instructor notes</label><textarea class="no-print" onchange="currentPlan.notes=this.value">${esc(p.notes)}</textarea><div class="print-hide">${esc(p.notes)}</div></div>`}
function listNames(a){return a.length?a.map(e=>esc(e.name)).join(' • '):'No exercises selected'}function cheatView(p){return `<table><tr><th>Time</th><th>Section</th><th>Exercises / stations</th></tr><tr><td>${p.warm} min</td><td>Warm-up</td><td>${listNames(p.warmEx)}</td></tr>${p.blocks.map(b=>`<tr><td>${b.minutes} min</td><td>${esc(b.title)} (${b.kind})</td><td>${listNames(b.items)}</td></tr>`).join('')}<tr><td>${p.cool} min</td><td>Cool-down</td><td>${listNames(p.coolEx)}</td></tr></table><p><b>Round:</b> ${p.settings.round}s work / ${p.settings.rest}s transition. <b>Rotations:</b> ${roleText(p.settings.group)}</p><p><b>Combination cues:</b> ${p.combos.map(c=>esc(c.name)).join(' • ')||'None selected'}</p>`}
function fullView(p){return `<h3>Warm-up — ${p.warm} min</h3>${itemList(p.warmEx,'warm')} ${p.blocks.map((b,bi)=>`<h3>${esc(b.title)} — ${b.minutes} min</h3><p class="muted">${b.kind==='Circuit'?`Rotate around ${b.items.length} numbered stations.`:'Everyone performs the same activity.'} Suggested interval ${p.settings.round}s work / ${p.settings.rest}s changeover; adapt repeats to fill block.</p>${itemList(b.items,'block'+bi)}<div class="row no-print"><select id="add-${bi}" style="max-width:330px">${allEx().map(e=>`<option value="${esc(e.id)}">${esc(e.name)} (${esc(e.equipment)})</option>`).join('')}</select><button onclick="addToPlan(${bi})">Add exercise</button></div>`).join('')}<h3>Cool-down — ${p.cool} min</h3>${itemList(p.coolEx,'cool')}<h3>Combination cues</h3>${p.combos.map((c,i)=>`<div class="entry"><b>${esc(c.name)}</b> <span class="chip">${esc(c.level)}</span><p>${esc(c.sequence)}</p><button class="no-print" onclick="removeCombo(${i})">Remove</button></div>`).join('')||'<p class="muted">No combinations selected.</p>'}<div class="row no-print"><select id="addcombo" style="max-width:330px">${allCombos().map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select><button onclick="addComboToPlan()">Add combination</button></div>`}
function itemList(items,loc){return items.map((e,i)=>`<div class="entry row"><div style="flex:1"><b>${loc.startsWith('block')&&currentPlan?.blocks[Number(loc.replace('block',''))]?.kind==='Circuit'?'Station ':'Exercise '}${i+1}. ${esc(e.name)}</b><div class="muted">${esc(e.category)} • ${esc(e.equipment)} • ${esc(e.level)}</div></div><details class="exercise-details"><summary>How to do it</summary><p>${esc(coaching(e))}</p>${demonstration(e)?`<a href="${esc(demonstration(e))}" target="_blank" rel="noopener noreferrer">Open saved demonstration ↗</a>`:''}</details><button class="no-print" onclick="removeExercise('${loc}',${i})">Remove</button></div>`).join('')||'<p class="muted">No exercises yet.</p>'}
function removeExercise(loc,i){let a=loc==='warm'?currentPlan.warmEx:loc==='cool'?currentPlan.coolEx:currentPlan.blocks[Number(loc.replace('block',''))].items;a.splice(i,1);render()}function addToPlan(i){let id=document.getElementById('add-'+i).value;let e=allEx().find(x=>x.id===id);if(e)currentPlan.blocks[i].items.push(e);render()}function addComboToPlan(){let c=allCombos().find(x=>x.id===document.getElementById('addcombo').value);if(c)currentPlan.combos.push(c);render()}function removeCombo(i){currentPlan.combos.splice(i,1);render()}function savePlan(){if(!currentPlan)return;currentPlan.notes=document.querySelector('textarea')?.value??currentPlan.notes;let idx=state.plans.findIndex(x=>x.id===currentPlan.id);if(idx>=0)state.plans[idx]=structuredClone(currentPlan);else state.plans.unshift(structuredClone(currentPlan));save();alert('Class saved on this device. Export a backup to keep a separate copy.')}function downloadFile(name,content,type='application/json'){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function downloadPlan(){if(currentPlan)downloadFile('boxercise-class.json',JSON.stringify(currentPlan,null,2))}function exportData(){downloadFile('boxercise-planner-backup.json',JSON.stringify(state,null,2))}function importData(event){let f=event.target.files?.[0];if(!f)return;f.text().then(t=>{try{let d=JSON.parse(t);if(!d.settings||!Array.isArray(d.plans)||!Array.isArray(d.custom))throw Error('Not a planner backup');if(!confirm('Replace all local app data with this backup?'))return;state=d;state.customCombos||=[];save();render();alert('Backup imported')}catch(e){alert('Unable to import: '+e.message)}})}
function exercisePage(){let list=allEx().filter(e=>(catFilter==='All'||e.category===catFilter)&&(equipFilter==='All'||e.equipment===equipFilter)&&(e.name+' '+e.category+' '+e.equipment+' '+coaching(e)).toLowerCase().includes(search.toLowerCase()));return `<div class="hero"><h2>Exercise library</h2><p>${allEx().length} boxing fitness and conditioning exercises with written technique guidance. No misleading automatic video matches.</p></div><div class="panel"><div class="grid no-print"><div><label>Search exercises and descriptions</label><input value="${esc(search)}" oninput="search=this.value;render();document.querySelector('input[placeholder*=Search]')?.focus()" placeholder="Search movement, equipment, body area..."></div><div><label>Category</label><select onchange="catFilter=this.value;render()">${opt(['All',...CATEGORIES],catFilter)}</select></div><div><label>Equipment</label><select onchange="equipFilter=this.value;render()">${opt(['All',...EQUIPMENT],equipFilter)}</select></div></div><details class="no-print"><summary>+ Add your own exercise</summary><form onsubmit="createExercise(event)"><div class="grid"><input name="name" required placeholder="Exercise name"><select name="category">${opt(CATEGORIES,'Cardio')}</select><select name="equipment">${opt(EQUIPMENT,'Bodyweight only')}</select><select name="level">${opt(['All','Beginner','Intermediate','Advanced'],'All')}</select></div><p><label><input type="checkbox" name="low">Suitable for low-impact classes</label></p><textarea name="desc" required placeholder="Step-by-step instructions and coaching notes"></textarea><label>Optional verified demonstration URL (YouTube, ACE, ExRx or NHS)</label><input name="video" type="url" placeholder="https://..."><button class="primary">Save exercise</button></form></details><p class="muted">Showing ${list.length} exercises</p>${list.map(e=>`<div class="entry"><div class="row"><b>${esc(e.name)}</b><span class="chip">${esc(e.category)}</span><span class="chip">${esc(e.equipment)}</span>${e.custom?'<span class="chip">Custom</span>':''}</div><p>${esc(coaching(e))}</p><div class="row">${demonstration(e)?`<a href="${esc(demonstration(e))}" target="_blank" rel="noopener noreferrer">Verified link saved by instructor ↗</a>`:'<span class="search-note">Written guidance available; no unverified video link</span>'}${e.custom?`<button onclick="deleteExercise('${e.id}')">Delete</button>`:''}</div></div>`).join('')||'<p>No matches. Try another filter.</p>'}</div>`}
function createExercise(ev){ev.preventDefault();let f=new FormData(ev.target),name=String(f.get('name')).trim();if(!name)return;state.custom.push({id:'custom'+Date.now(),name,category:f.get('category'),equipment:f.get('equipment'),level:f.get('level'),low:f.has('low'),desc:f.get('desc')||'Instructor-added exercise.',video:f.get('video')||'',custom:true});save();render()}function deleteExercise(id){if(confirm('Delete this custom exercise?')){state.custom=state.custom.filter(e=>e.id!==id);save();render()}}
function comboPage(){let a=allCombos().filter(c=>(comboFilter==='All'||c.level===comboFilter)&&(c.name+' '+c.sequence+' '+c.kind).toLowerCase().includes(search.toLowerCase()));return `<div class="panel"><h2>Combination library (${allCombos().length})</h2><p class="muted">Fitness-focused movement cues for shadowboxing and supervised, light padwork. Sequences are templates, not verified instructional tutorials.</p><div class="grid no-print"><div><label>Search</label><input value="${esc(search)}" oninput="search=this.value;render()" placeholder="Jab, pivot, duck, weave..."></div><div><label>Level</label><select onchange="comboFilter=this.value;render()">${opt(['All','Beginner','Intermediate','Advanced'],comboFilter)}</select></div></div><details class="no-print"><summary>Create a custom combination</summary><form onsubmit="createCombo(event)"><div class="grid"><input name="name" required placeholder="Combination name"><select name="level">${opt(['Beginner','Intermediate','Advanced'],'Beginner')}</select></div><textarea name="sequence" required placeholder="Movement cues separated by commas"></textarea><button class="primary">Save combination</button></form></details><p class="muted">Showing ${a.length} combinations</p>${a.slice(0,140).map(c=>`<div class="entry"><div class="row"><b>${esc(c.name)}</b><span class="chip">${esc(c.level)}</span><span class="chip">${esc(c.kind)}</span></div><p>${esc(c.sequence)}</p>${c.custom?`<button onclick="deleteCombo('${c.id}')">Delete</button>`:''}</div>`).join('')}</div>`}
function createCombo(ev){ev.preventDefault();let f=new FormData(ev.target);state.customCombos.push({id:'cc'+Date.now(),name:f.get('name'),level:f.get('level'),sequence:f.get('sequence'),kind:'Custom',notes:'Instructor-added fitness movement cue.',custom:true});save();render()}function deleteCombo(id){if(confirm('Delete combination?')){state.customCombos=state.customCombos.filter(c=>c.id!==id);save();render()}}
function savedPage(){return `<div class="panel"><h2>Saved classes (${state.plans.length})</h2>${state.plans.map(p=>`<div class="entry row"><div style="flex:1"><b>${esc(p.name)}</b><p class="muted">${p.duration} min • ${esc(p.settings?.format||'Class')} • ${esc(p.settings?.focus||'Mixed')}</p></div><button onclick="loadPlan('${p.id}')">Open</button><button onclick="duplicatePlan('${p.id}')">Duplicate</button><button onclick="deletePlan('${p.id}')">Delete</button></div>`).join('')||'<p>No saved classes yet. Generate or build a class, then save it.</p>'}</div>`}function loadPlan(id){currentPlan=structuredClone(state.plans.find(p=>p.id===id));tab='Builder';showCheat=false;render()}function duplicatePlan(id){let p=structuredClone(state.plans.find(p=>p.id===id));p.id='p'+Date.now();p.name+=' (copy)';state.plans.unshift(p);save();render()}function deletePlan(id){if(confirm('Delete saved class?')){state.plans=state.plans.filter(p=>p.id!==id);save();render()}}
function timerPage(){return `<div class="panel"><h2>Round timer</h2><p class="muted">Large-screen timer for rounds and partner changes. Keep this tab open while running.</p><div class="timer" id="timer-display">${fmtTime(timerSeconds)}</div><div class="row" style="justify-content:center"><button class="primary" onclick="startTimer()">Start</button><button onclick="pauseTimer()">Pause</button><button onclick="resetTimer()">Reset to work interval</button></div><p class="muted" style="text-align:center">Work: ${state.settings.round}s • Transition: ${state.settings.rest}s</p></div>`}function beep(){try{let C=window.AudioContext||window.webkitAudioContext;let ctx=new C(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=740;gain.gain.value=.1;osc.start();osc.stop(ctx.currentTime+.2);osc.onended=()=>ctx.close()}catch{}}function startTimer(){if(timerRunning)return;timerRunning=true;timerId=setInterval(()=>{timerSeconds=Math.max(0,timerSeconds-1);let e=document.getElementById('timer-display');if(e)e.textContent=fmtTime(timerSeconds);if(!timerSeconds){pauseTimer();beep()}},1000)}function pauseTimer(){timerRunning=false;clearInterval(timerId)}function resetTimer(){pauseTimer();timerSeconds=state.settings.round;render()}
function helpPage(){return `<div class="panel"><h2>Using the planner</h2><p><b>1.</b> Select group format, focus, equipment and duration in Builder. <b>2.</b> Generate a class or start a blank one. <b>3.</b> Add/remove exercises and combination cues. <b>4.</b> Save, print or export.</p><h3>Pairs and threes</h3><p>${roleText('Mixed pairs and threes')} Always assign roles appropriate to the exercise; not every station needs pads.</p><h3>Internet demonstrations</h3><p>Each exercise now includes written coaching guidance. Unverified automatic video searches have been removed. You can add a trusted demonstration URL to your own exercises, and should review technique before teaching.</p><h3>Privacy and backup</h3><p>Classes and custom entries are stored in this browser's local storage on this device. They do not sync automatically. Export a backup before clearing browser data or changing devices.</p><h3>Safety</h3><p>Designed for non-contact fitness classes, not sparring. Keep clear space, inspect pads and equipment, use controlled movements, offer alternatives and avoid partner-to-partner strikes. Seek appropriate instructor training and follow your venue's policies.</p><h3>Install</h3><p>Host the files on GitHub Pages or another static host. On supported browsers, use “Add to Home screen” for quick access.</p></div>`}
render();
</script></body></html>
