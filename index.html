function builder(){let s=state.settings;return `<div class="hero"><h2>Build a class that flows.</h2><p>Choose your format, group size and equipment. Generate a follow-along workout, a station circuit or both in one session.</p><div class="statbar"><div class="stat"><strong>${allEx().length}</strong>Exercises</div><div class="stat"><strong>${allCombos().length}</strong>Combinations</div><div class="stat"><strong>${state.plans.length}</strong>Saved classes</div></div></div><div class="panel"><h2>1. Class setup</h2><div class="grid"><div class="format-card"><strong>Everyone together</strong><small>All participants follow the same coached activity.</small></div><div class="format-card"><strong>Circuit stations</strong><small>Choose how many stations and rotate groups.</small></div><div class="format-card"><strong>Mixed class</strong><small>Start together, then move into a circuit.</small></div></div><h3>2. Choose your settings</h3><div class="grid"><div><label>Class name</label><input value="${esc(s.name)}" onchange="updateSetting('name',this.value)"></div><div><label>Duration (minutes)</label><input type="number" min="15" max="180" value="${s.duration}" onchange="updateSetting('duration',this.value)"></div><div><label>Participants</label><input type="number" min="2" max="100" value="${s.participants}" onchange="updateSetting('participants',this.value)"></div><div><label>Group setup</label><select onchange="updateSetting('group',this.value)">${opt(GROUPS,s.group)}</select></div><div><label>Class format</label><select onchange="updateSetting('format',this.value)">${opt(FORMATS,s.format)}</select></div><div><label>Focus</label><select onchange="updateSetting('focus',this.value)">${opt(FOCUSES,s.focus)}</select></div><div><label>Ability</label><select onchange="updateSetting('level',this.value)">${opt(['Beginners','Mixed abilities','Experienced'],s.level)}</select></div><div><label>Circuit stations</label><input type="number" min="2" max="20" value="${s.stations}" onchange function seededShuffle(arr){return [...arr].sort(()=>Math.random()-.5)}function available(pool){let s=state.settings;return pool.filter(e=>(e.equipment==='Bodyweight only'||s.equipment.includes(e.equipment))&&(s.level!=='Beginners'||e.level!=='Advanced')&&(s.focus!=='Low-impact boxercise'||e.low||['Mobility','Recovery'].includes(e.category)))}

ath.max(3,Math.round(main*.45));blocks=[{title:'Follow-along technique and cardio',minutes:a,kind:'Together',items:pick(pool,Math.max(3,Math.min(8,Math.round(a/3))),used)},{title:'Rotating station circuit',minutes:main-a,kind:'Circuit',items:chosen}]};currentPlan={id:'p'+Date.now(),name:s.name||'Boxercise class',created:new Date().toISOString(),settings:structuredClone(s),duration,warm,cool,warmEx,coolEx,blocks,combos,notes:'',manual:false};showCheat=false;render()}

function timerPage(){return `<div class="panel"><h2>Round timer</h2><p class="muted">Large-screen timer for rounds and partner changes. Keep this tab open while running.</p><div class="timer" id="timer-display">${fmtTime(timerSeconds)}</div><div class="row" style="justify-content:center"><button class="primary" onclick="startTimer()">Start</button><button onclick="pauseTimer()">Pause</button><button onclick="resetTimer()">Reset to work interval</button></div><p class="muted" style="text-align:center">Work: ${state.settings.round}s • Transition: ${state.settings.rest}s</p></div>`}function beep(){try{let C=window.AudioContext||window.webkitAudioContext;let ctx=new C(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=740;gain.gain.value=.1;osc.start();osc.stop(ctx.currentTime+.2);osc.onended=()=>ctx.close()}catch{}}function startTimer(){if(timerRunning)return;timerRunning=true;timerId=setInterval(()=>{timerSeconds=Math.max(0,timerSeconds-1);let e=document.getElementById('timer-display');if(e)e.textContent=fmtTime(timerSeconds);if(!timerSeconds){pauseTimer();beep()}},1000)}function pauseTimer(){timerRunning=false;clearInterval(timerId)}function resetTimer(){pauseTimer();timerSeconds=state.settings.round;render()}

ipment is limited.</p>`:''}${groupCount>12?'<p class="muted">Showing the first 12 groups.</p>':''}<p class="muted">For mixed pairs and threes, arrange groups according to attendance. Keep padwork roles supervised and avoid striking another participant.</p>`}).join('')}</section>`}
function swapStation(bi,si){if(!currentPlan)return;let b=currentPlan.blocks[bi],old=b.items[si],choices=available(allEx()).filter(e=>e.id!==old.id&&!b.items.some((x,j)=>j!==si&&x.id===e.id));let answer=prompt('Find replacement exercise by name (enter a search word):',old.name);if(answer===null)return;let hits=choices.filter(e=>(e.name+' '+e.category).toLowerCase().includes(answer.trim().toLowerCase())).slice(0,15);if(!hits.length){alert('No matching exercises with selected equipment. Try a different name.');return}let menu=hits.map((e,i)=>`${i+1}. ${e.name} — ${e.equipment}`).join('\n');let pickNum=Number(prompt('Choose an exercise number:\n'+menu,'1'));if(!Number.isInteger(pickNum)||pickNum<1||pickNum>hits.length)return;b.items[si]=hits[pickNum-1];render()}

function liveBuild(p){const steps=[];function put(label,seconds,detail,kind,station=0){if(seconds>0)steps.push({label,seconds,detail,kind,station})}

function v7Programmes(){return `<div class="hero"><h2>Programmes & history</h2><p>Build multiweek teaching schedules using your saved classes.</p></div><div class="panel"><h2>Create a programme</h2><form onsubmit="v7ProgramCreate(event)"><div class="grid"><label>Programme name<input name="name" required placeholder="6-week boxing fitness"></label><label>Weeks<input name="weeks" type="number" min="1" max="12" value="6"></label><label>Sessions per week<input name="sessions" type="number" min="1" max="5" value="2"></label></div><button class="primary">Create from saved classes</button></form><p class="muted">Classes are rotated from your saved plans. Open each one to adjust progression and difficulty.</p></div>${v7.programmes.map(pr=>`<div class="panel"><div class="row"><h2>${esc(pr.name)}</h2><button onclick="v7DeleteProgramme('${pr.id}')">Delete</button></div>${pr.schedule.map(w=>`<details><summary>Week ${w.week}</summary>${w.sessions.map((id,j)=>`<div class="entry row">Session ${j+1}: ${esc(state.plans.find(p=>p.id===id)?.name||'Missing saved class')} <button onclick="loadPlan('${id}')">Open</button></div>`).join('')}</details>`).join('')}</div>`).join('')}<div class="panel"><h2>Completed class history</h2>${v7.history.map(h=>`<div class="entry"><b>${esc(h.name)}</b> · ${new Date(h.date).toLocaleDateString()}<p>${esc(h.notes)}</p></div>`).join('')||'<p class="muted">Mark saved classes as taught to keep a history.</p>'}</div>`}
function v7DeleteProgramme(id){if(confirm('Delete programme?')){v7.programmes=v7.programmes.filter(x=>x.id!==id);save();render()}}
function v7Templates(){return `<div class="panel"><h2>Saved class templates</h2>${v7.templates.map(t=>`<div class="entry row"><b>${esc(t.name)}</b><button onclick="v7LoadTemplate('${t.id}')">Use template</button><button onclick="v7DeleteTemplate('${t.id}')">Delete</button></div>`).join('')||'<p>No templates yet. Save one from the class builder.</p>'}</div>`}
function v7DeleteTemplate(id){if(confirm('Delete template?')){v7.templates=v7.templates.filter(x=>x.id!==id);save();render()}}
const v7OldSaved=savedPage;savedPage=function(){return v7OldSaved()+v7Templates()+`<div class="panel"><h2>Backup & recovery</h2><p>Export a complete backup before reinstalling, changing browsers or updating. V7 uses the same local data store as previous versions.</p><button class="primary" onclick="exportData()">Download full backup</button><label>Restore a backup <input type="file" accept="application/json,.json" onchange="importData(event)"></label></div>`};
const v7OldNav=nav;nav=function(){document.getElementById('nav').innerHTML=['Dashboard','Builder','Live class','Exercises','Combinations','Programmes','Saved classes','Round timer','Help'].map(t=>`<button class="${tab===t?'active':''}" onclick="switchTab('${t}')">${t}</button>`).join('')};
const v7OldRender=render;render=function(){if(tab==='Dashboard'||tab==='Programmes'){nav();document.getElementById('app').innerHTML=tab==='Dashboard'?v7Hub():v7Programmes()}else v7OldRender()};
// Instructor mode: preserve original timer engine, add full-screen, voice cue and role display.
let v7Voice=false;

const v7OldSignal=liveSignal;liveSignal=function(){v7OldSignal();let step=liveSteps[liveIndex];if(step)v7Speak(step.label)};
function v7Full(){let el=document.getElementById('live-content');if(!el)return;if(document.fullscreenElement)document.exitFullscreen?.();else el.requestFullscreen?.().catch(()=>alert('Full-screen mode is not supported in this browser.'))}
const v7OldLivePage=livePage;livePage=function(){return v7OldLivePage()+`<div class="panel no-print"><h2>Instructor controls</h2><button class="primary" onclick="v7Full()">Toggle full screen</button><label class="v7-voice"><input type="checkbox" ${v7Voice?'checked':''} onchange="v7Voice=this.checked"> Spoken exercise and rotation cues</label><p class="muted">For pairs swap roles each work interval; for threes rotate boxer, holder and conditioning roles. All sessions are non-contact fitness.</p></div>`};
const v7OldLivePaint=livePaint;livePaint=function(){v7OldLivePaint();let el=document.getElementById('live-content');if(!el||!liveSteps.length)return;let step=liveSteps[liveIndex];if(step){let n=liveIndex+1;el.insertAdjacentHTML('beforeend',`<div class="v7-next"><b>COACHING CUE</b><p>${esc(step.detail)}</p><p>${esc(livePlan?.settings?.group||'Pairs')} · Change roles on the interval cue</p></div>`)}};
const v7OldLoad=liveLoad;liveLoad=function(p){v7OldLoad(p);};
// Extra library entries use clear descriptive coaching rather than guessed video URLs.
const v7Variants=[['Shadowboxing','Bodyweight only',['Boxing stance reset','Jab with lateral step','Cross with step back','Jab-cross then pivot','Alternating hooks at light pace','Controlled uppercut sequence','Combination and guard reset','Mirror movement drill']],['Footwork','Bodyweight only',['Four-corner footwork','Forward-backward step ladder','Side-step and balance','Clock-face direction changes','Cone-free agility square','Pivot and freeze','Lateral shuffle and stop','Step-and-reset rhythm']],['Coordination','Bodyweight only',['Partner mirror footwork','Call-and-response movement','Hand-eye rhythm pattern','Alternating hand cue drill','Cross-body coordination','Direction cue reaction','Guard and balance sequence','Partner tempo matching']],['Core','Exercise mats',['Dead bug with pause','Side plank knee-supported','Bird dog hold','Supine trunk brace','Glute bridge march','Seated trunk rotation control','Heel taps with brace','Quadruped shoulder taps']],['Strength','Resistance bands',['Band pull apart','Band row hold','Band squat to stand','Band external rotation','Band chest press light','Band anti-rotation hold','Band reverse fly','Band lateral walk']],['Cardio','Bodyweight only',['March and jab rhythm','Low-impact step jacks','Fast feet in place','Side-step cardio intervals','Alternating knee raise','Boxer shuffle easy','Controlled high-knee march','Step-touch combination']]];
let v7exid=1;for(let [category,equipment,names] of v7Variants)for(let name of names){if(!base.some(e=>e.name===name))base.push({id:'v7ex'+v7exid++,name,category,equipment,level:'All',low:!name.includes('Fast feet'),desc:`${name}: set a comfortable stance, demonstrate the movement slowly, then repeat for the planned interval. Maintain controlled posture and steady breathing; scale speed and range to each participant.`,custom:false})}
const v7ComboMoves=['Jab','Cross','Lead hook','Rear hook','Lead uppercut','Rear uppercut'];const v7Foot=['Step left','Step right','Step back','Pivot and reset','Guard reset'];let v7cid=0;for(let a=0;a<6;a++)for(let b=0;b<6;b++)for(let f=0;f<5;f++){let seq=`${v7ComboMoves[a]} → ${v7ComboMoves[b]} → ${v7Foot[f]}`;if(!combinations.some(c=>c.sequence===seq))combinations.push({id:'v7combo'+(++v7cid),name:`Combination ${a+1}-${b+1}-${f+1}`,level:a===b?'Beginner':'Intermediate',sequence:seq,kind:'Boxing fitness',notes:'Non-contact shadowboxing or supervised light padwork.'})}

// V7.1: make group formats and station instructions explicit in the actual class plan.
function v71Groups(s){const sizes=v7Groups(s);return sizes.map((size,i)=>({name:`Group ${i+1}`,size}));}
function v71Station(e,size,seconds){
 const name=String(e.name||'Exercise'),cat=String(e.category||''),pads=cat==='Padwork',work=Math.max(20,Number(seconds)||90),each=Math.floor(work/size);
 const intro=pads?'One participant boxes with controlled light contact on focus pads; the holder presents stable pads and keeps a safe distance.':'Everyone performs the named exercise at their own comfortable pace; keep space between participants.';
 const roles=size===3?(pads?`A boxes, B holds pads, C does gentle shadowboxing or footwork. Switch every ${each}s: A → pads, B → conditioning, C → boxer; rotate again so each person boxes, holds and conditions.`:`A, B and C do the exercise together if space and equipment allow. If sharing one item, take turns approximately every ${each}s while others practise the movement without equipment.`):(pads?`A boxes and B holds pads for ${each}s, then swap for ${work-each}s.`:`Both work together if there is room and equipment; otherwise alternate approximately every ${each}s.`);
 const cue=cat==='Footwork'?'Keep a balanced stance and use short, controlled steps.':cat==='Core'?'Brace gently, breathe normally and avoid rushing.':cat==='Strength'?'Use a manageable resistance and controlled repetitions.':cat==='Padwork'?'Keep wrists aligned, use light pad contact and never strike a partner.':'Demonstrate slowly first and offer an easier option.';
 return {intro,roles,cue};
}
function v71Guide(p){let gs=v71Groups(p.settings),threes=gs.filter(x=>x.size===3).length,pairs=gs.filter(x=>x.size===2).length,other=gs.filter(x=>x.size!==2&&x.size!==3);return `<section class="panel"><h2>👥 Group setup — ${esc(p.settings.group)}</h2><p><b>${Number(p.settings.participants)||0} participants:</b> ${threes} group(s) of three${pairs?` and ${pairs} pair(s)`:''}${other.length?' (one larger group needs instructor adjustment)':''}.</p><div class="v7-cards">${gs.map(g=>`<article><h3>${g.name} · ${g.size} people</h3><p>${g.size===3?'A = boxer / performer · B = pad holder / coach · C = conditioning or shadowboxing. Rotate roles three times during each padwork station.':'A = boxer / performer · B = holder / coach. Swap halfway through padwork.'}</p></article>`).join('')}</div><p class="section-note">At non-pad stations, all three may work together if equipment and space permit. Roles change only where the station needs them. For padwork, each trio needs adequate pads, supervision and safe spacing.</p></section>`}
function stationBoard(p){const circuits=p.blocks.map((b,i)=>({b,i})).filter(x=>x.b.kind==='Circuit');if(!circuits.length)return '';const gs=v71Groups(p.settings),work=Number(p.settings.round)||90,rest=Number(p.settings.rest)||30;return `<section class="panel"><h2>🥊 Circuit station instructions</h2><p>Read each card before teaching. <b>${esc(p.settings.group)}</b> · ${gs.length} groups · ${work}s work + ${rest}s move/rest. Every group moves to the next numbered station after each round.</p>${circuits.map(({b,i})=>`<h3>${esc(b.title)} · ${b.minutes} min</h3><div class="station-grid">${b.items.map((e,j)=>{let d=v71Station(e,3,work);return `<article class="station-card"><div class="station-num">${j+1}</div><div><h3>Station ${j+1}: ${esc(e.name)}</h3><small>Equipment: ${esc(e.equipment)} · ${esc(e.category)}</small><p><b>What to do:</b> ${esc(coaching(e))}</p><p><b>How this station works:</b> ${esc(d.intro)}</p><p><b>In threes:</b> ${esc(d.roles)}</p><p><b>In pairs:</b> ${esc(v71Station(e,2,work).roles)}</p><p><b>Coach's cue:</b> ${esc(d.cue)}</p><button class="no-print" onclick="swapStation(${i},${j})">Change station exercise</button></div></article>`}).join('')}</div><p><b>Station rotation:</b> ${work}s activity, ${rest}s to move and reset. Each group begins at a different station when possible. If there are more groups than stations, check space and equipment before sharing.</p>`).join('')}</section>`}
function v7Rotation(p){const gs=v71Groups(p.settings),c=p.blocks.find(b=>b.kind==='Circuit');if(!c?.items.length)return '';const n=c.items.length;return `<section class="panel"><h2>Group-by-group station rotation</h2><p>${gs.map(g=>`${g.name}: ${g.size} people`).join(' · ')}</p><div class="rotation-scroll"><table class="rotation-table"><tr><th>Round</th>${gs.map(g=>`<th>${g.name} (${g.size})</th>`).join('')}</tr>${Array.from({length:n},(_,r)=>`<tr><td>${r+1}</td>${gs.map((g,i)=>{let idx=(i+r)%n,e=c.items[idx],d=v71Station(e,g.size,p.settings.round);return `<td><b>Station ${idx+1}</b><br>${esc(e.name)}<br><small>${esc(d.roles)}</small></td>`}).join('')}</tr>`).join('')}</table></div>${gs.length>n?`<p class="warning">${gs.length} groups share ${n} stations. Check capacity and equipment or increase the number of stations.</p>`:''}</section>`}
const v71OldPlanView=planView;planView=function(p){return v71Guide(p)+v71OldPlanView(p)};
const v71OldFullView=fullView;fullView=function(p){return `<div class="section-note"><b>Teaching format:</b> ${esc(p.settings.group)}. ${p.settings.group==='Threes'?'Use A/B/C rotations for padwork; all three can work together at suitable conditioning stations.':'Use A/B swaps for padwork; groups work together at suitable conditioning stations.'} Work interval ${p.settings.round}s, changeover ${p.settings.rest}s.</div>`+v71OldFullView(p)};
const v71OldCheatView=cheatView;cheatView=function(p){return `<p><b>Groups:</b> ${esc(p.settings.group)} · ${v71Groups(p.settings).map(g=>`${g.name} (${g.size})`).join(', ')}</p>`+v71OldCheatView(p)};


// V7.2: exercise-specific teaching cards and accurate three-person role changes.
const v72Details=[
 [/jab|cross|hook|uppercut|punch|one-two|pad target|padwork/i,['Stand balanced with hands ready. Rehearse the named sequence slowly, then use controlled, light contacts on the pads; reset after each repetition.','A: perform the sequence. B: hold the pads steady and call the sequence. C: shadowbox the same sequence without contact.','Keep movements controlled; pads are targets, not a contest for power.']],
 [/slip|duck|weave|bob/i,['Practise a small comfortable bend or weight shift, then return to a balanced standing position. Keep the movement slow and controlled.','A: demonstrate the named movement. B: call the cue and observe balance. C: mirror at their own pace; change leader at each cue.','Avoid exaggerated bending or twisting.']],
 [/pivot|side.step|step.back|footwork|shuffle|direction|cone|ladder|quick feet|zigzag/i,['Mark a clear path. Step through the named pattern with short controlled steps, pause at the end, then repeat in the other direction.','A: lead the pattern. B: follow a safe distance behind. C: observe and call the next direction; swap leader at each cue.','Keep space between people and avoid crossing feet.']],
 [/skipping|jump rope|rope skipping/i,['Hold the rope handles loosely and use small comfortable skips, or step over the rope one foot at a time.','A: skip with the rope. B: perform rope-free step-overs. C: march with coordinated arm circles; rotate the rope on each cue.','Use a clear floor area and low-impact steps as needed.']],
 [/squat|sit-to-stand/i,['Stand with feet comfortably apart, bend hips and knees as though sitting, then stand up tall. Use a stable chair if needed.','A, B and C: perform controlled repetitions together, with space between each person; one person calls the pace and rotates as leader.','Knees track comfortably in line with feet.']],
 [/lunge|step-up/i,['Use a short step or stable low platform. Move down and up slowly, then change the leading leg.','A, B and C: take turns leading a small set of repetitions while the others perform the floor-level alternative.','Use support if balance is uncertain.']],
 [/push.up/i,['Place hands on a stable wall or raised surface, bend elbows gently, then push away with the body aligned.','A, B and C: use separate wall spaces or floor spots; work together and take turns calling the pace.','Choose a comfortable angle and avoid straining wrists.']],
 [/plank|bear hold|dead bug|bird dog|glute bridge|mountain climber/i,['Set up on a mat with enough personal space. Follow the named core exercise slowly, breathing normally and stopping if form deteriorates.','A, B and C: use separate mats or floor spaces and work simultaneously; if only one mat is available, rotate on each cue while others do standing knee lifts.','Keep movements controlled and breathe continuously.']],
 [/medicine ball/i,['Use a manageable ball and repeat the named movement slowly, keeping the ball close and movements controlled.','A: perform the ball movement. B: do the same movement without the ball. C: perform a gentle march; rotate the ball at each cue.','Do not throw or pass the ball unless the activity is specifically supervised and suitable.']],
 [/dumbbell|kettlebell|resistance band|band press|band row/i,['Choose a manageable resistance. Set your stance, demonstrate the named movement without weight, then repeat slowly with control.','A: use the equipment. B: rehearse the movement without equipment. C: march or perform a bodyweight alternative; rotate equipment at each cue.','Check equipment condition and avoid forcing range.']],
 [/stretch|mobility|rotation|circles|breathing|cooldown|recovery/i,['Move gently through a comfortable range with steady breathing; do not force or bounce.','A, B and C: follow the same mobility movement together, each at a comfortable range.','This is recovery, not a competition.']],
 [/shadow|mirror|reaction|rhythm|coordination|target touch|number call/i,['Rehearse the named pattern at a slow pace, then respond to a clear verbal or visual cue while maintaining distance.','A: perform the movement. B: call or demonstrate the cue. C: mirror the movement at a safe distance; rotate who leads.','Prioritise accuracy and space over speed.']],
 [/march|walk|jog|cardio|fast feet|high knees|side step/i,['Work through the named movement at a sustainable pace. Use marching as a lower-impact alternative.','A, B and C: perform the activity together with separate personal space; rotate who calls the pace.','Land softly and slow down when needed.']]
];
function v72Explain(e,size,seconds){
 const name=String(e.name||'Exercise'),cat=String(e.category||''),eq=String(e.equipment||'Bodyweight only');
 const found=v72Details.find(x=>x[0].test(name));
 const how=found?found[1][0]:(e.desc&& !/non-contact fitness exercise|set a comfortable stance/i.test(e.desc)?e.desc:categoryInstructions[cat]||'Demonstrate the named movement slowly, then repeat with control and a comfortable range.');
 const cue=found?found[1][2]:'Keep movements controlled, maintain personal space and offer a simpler variation.';
 const pads=cat==='Padwork'||eq==='Focus pads';const shared=eq!=='Bodyweight only'&&eq!=='Exercise mats';
 const work=Math.max(20,Number(seconds)||90),split=Math.floor(work/size);
 let roles,changes;
 if(size===3){
  if(pads){roles='First turn: A boxes the named sequence, B holds the pads, C practises shadowboxing without contact. Second turn: C boxes, A holds pads, B shadowboxes. Third turn: B boxes, C holds pads, A shadowboxes.';changes=`Change roles at ${split}s and ${split*2}s; each person gets a turn boxing, holding and shadowboxing.`;}
  else if(shared){roles=found?found[1][1]:'A uses the equipment, B rehearses without equipment, C does a bodyweight alternative. Rotate who has the equipment.';changes=`Rotate roles at ${split}s and ${split*2}s. Check that the available equipment and space allow the activity.`;}
  else {roles=found?found[1][1]:'A, B and C perform the named movement together, each with their own safe space.';changes='All three work together; no equipment change is required. Change the leader or caller if useful.';}
 }else{
  if(pads){roles='A boxes the named sequence while B holds the pads. Halfway through, B boxes and A holds.';changes=`Swap after ${Math.floor(work/2)}s.`;}
  else if(shared){roles='A uses the equipment while B performs the movement without equipment or a bodyweight alternative. Then swap.';changes=`Swap after ${Math.floor(work/2)}s.`;}
  else {roles='A and B perform the exercise together with enough space between them.';changes='Work together; swap who leads or calls the pace if helpful.';}
 }
 return {how,roles,changes,cue};
}
function v72Card(e,size,seconds){let d=v72Explain(e,size,seconds);return `<p><b>How to do it:</b> ${esc(d.how)}</p><p><b>${size===3?'Exactly what A, B and C do':'Exactly what A and B do'}:</b> ${esc(d.roles)}</p><p><b>When to change:</b> ${esc(d.changes)}</p><p><b>Coaching tip:</b> ${esc(d.cue)}</p>`}
function stationBoard(p){const circuits=p.blocks.map((b,i)=>({b,i})).filter(x=>x.b.kind==='Circuit');if(!circuits.length)return '';const sizes=[...new Set(v71Groups(p.settings).map(g=>g.size))],work=Number(p.settings.round)||90,rest=Number(p.settings.rest)||30;return `<section class="panel"><h2>🥊 Station-by-station teaching instructions</h2><p>${esc(p.settings.group)} · ${work}s work + ${rest}s transition. Each card explains the exercise, each person's task and exactly when to change.</p>${circuits.map(({b,i})=>`<h3>${esc(b.title)}</h3><div class="station-grid">${b.items.map((e,j)=>`<article class="station-card"><div class="station-num">${j+1}</div><div><h3>Station ${j+1}: ${esc(e.name)}</h3><small>Equipment: ${esc(e.equipment||'None')} · ${esc(e.category||'Fitness')}</small>${sizes.map(sz=>`<div class="v72-role"><h4>${sz===3?'Working in threes':'Working in pairs'}</h4>${v72Card(e,sz,work)}</div>`).join('')}<button class="no-print" onclick="swapStation(${i},${j})">Change exercise</button></div></article>`).join('')}</div>`).join('')}</section>`}
function v7Rotation(p){const gs=v71Groups(p.settings),c=p.blocks.find(b=>b.kind==='Circuit');if(!c?.items.length)return '';const n=c.items.length;return `<section class="panel"><h2>Group-by-group station rotation</h2><p>${gs.map(g=>`${g.name}: ${g.size} people`).join(' · ')}</p><div class="rotation-scroll"><table class="rotation-table"><tr><th>Round</th>${gs.map(g=>`<th>${g.name} (${g.size})</th>`).join('')}</tr>${Array.from({length:n},(_,r)=>`<tr><td>${r+1}</td>${gs.map((g,i)=>{let idx=(i+r)%n,e=c.items[idx],d=v72Explain(e,g.size,p.settings.round);return `<td><b>Station ${idx+1}: ${esc(e.name)}</b><br><small>${esc(d.roles)} ${esc(d.changes)}</small></td>`}).join('')}</tr>`).join('')}</table></div>${gs.length>n?`<p class="warning">${gs.length} groups for ${n} stations. Verify equipment and space before sharing stations.</p>`:''}</section>`}
// Render dashboard on first visit, without changing stored user data.
tab='Dashboard';render();
